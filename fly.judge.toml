app = "onrecord-judge"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BASE_RPC_URL = "https://mainnet.base.org"
  ONRECORD_JUDGE_MODE = "true"
  ONRECORD_PROTECT_READS = "false"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "onrecord_judge_data"
  destination = "/app/data"
