name: Deploy OnRecord to Fly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.fly.io/onrecord-desk:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate Docker with Fly Registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push one release image
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy private operator app
        run: flyctl deploy --app onrecord-desk --image "$IMAGE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy public judge app
        run: flyctl deploy --config fly.judge.toml --app onrecord-judge --image "$IMAGE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
