app = "onrecord-desk"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BASE_RPC_URL = "https://mainnet.base.org"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.status]
    type = "http"
    path = "/api/status"
    method = "get"
    interval = "15s"
    timeout = "2s"

[[mounts]]
  source = "onrecord_data"
  destination = "/app/data"
