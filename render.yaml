services:
  - type: web
    name: onrecord-desk
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SIBYL_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
    disk:
      name: onrecord-data
      mountPath: /app/data
      sizeGB: 1
